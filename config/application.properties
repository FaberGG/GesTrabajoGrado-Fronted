# Configuración del API Gateway para Gestión Trabajo de Grado - Frontend

# ========================================
# CONFIGURACIÓN DEL API GATEWAY
# ========================================

# URL base del API Gateway
# Cambiar según el entorno (desarrollo, producción)
gateway.url=http://localhost:8080

# ========================================
# MODO DE OPERACIÓN
# ========================================

# Modo desarrollo (permite debugging adicional)
# true = desarrollo, false = producción
dev.mode=false

# Si el Gateway inyecta automáticamente los headers de usuario desde el JWT
# true = producción (el gateway los inyecta), false = desarrollo (se envían manualmente)
gateway.injects.headers=true

# ========================================
# CONFIGURACIÓN DE ARCHIVOS
# ========================================

# Tamaño máximo de archivos en bytes
# PDF general: 15 MB
max.pdf.size=15728640

# PDF Formato A: 10 MB
max.formatoa.pdf.size=10485760

# Carta: 5 MB
max.carta.size=5242880

# ========================================
# RUTAS DE ENDPOINTS (Identity Service)
# ========================================

# Endpoints de autenticación
identity.login.path=/api/identity/auth/login
identity.profile.path=/api/identity/auth/profile
identity.verify.path=/api/identity/auth/verify-token

# ========================================
# RUTAS DE ENDPOINTS (Submission Service)
# ========================================

# Endpoints de submissions
submission.anteproyecto.path=/api/submissions/anteproyecto
submission.formatoa.path=/api/submissions/formatoA

# ========================================
# TIMEOUTS (en segundos)
# ========================================

# Timeout para conexiones HTTP
http.connect.timeout=30

# Timeout para operaciones de lectura
http.read.timeout=60

# Timeout para uploads (más largo por archivos grandes)
http.upload.timeout=120

# ========================================
# CONFIGURACIÓN DE UI
# ========================================

# Tamaño de página por defecto para listados
ui.page.size=20

# Refresh automático de listados (en segundos, 0 = deshabilitado)
ui.auto.refresh=0

# ========================================
# LOGGING
# ========================================

# Nivel de logging (DEBUG, INFO, WARN, ERROR)
log.level=INFO

# Mostrar detalles de requests HTTP en consola
log.http.details=false

